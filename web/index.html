<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ai-chat</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- 侧边栏：会话列表。会话只存在浏览器本地，服务端依旧无状态 -->
  <aside class="sidebar">
    <button id="new-session" class="sidebar__new" type="button">＋ 新对话</button>
    <div class="sidebar__list" id="session-list"></div>
  </aside>

  <div class="main">
  <!-- 顶栏：标题 + 一行流式状态（首字延迟 / 总耗时），方便直观判断是不是真流式 -->
  <header class="topbar">
    <span class="topbar__title">ai-chat</span>
    <div class="topbar__actions">
      <span class="topbar__status" id="status"></span>
      <button id="payload-toggle" class="topbar__toggle" type="button">请求体</button>
      <span class="topbar__user" id="user-info"></span>
      <button id="logout" class="topbar__toggle" type="button">退出</button>
    </div>
  </header>

  <!-- 请求体面板：分两块显示，因为「本次发出的请求」和「累积的上下文」不是一回事 -->
  <section class="payload" id="payload" hidden>
    <div class="payload__block" id="sent-block" hidden>
      <div class="payload__title" id="sent-title"></div>
      <pre id="sent-text"></pre>
    </div>
    <div class="payload__block">
      <div class="payload__title" id="history-title"></div>
      <pre id="history-text"></pre>
    </div>
  </section>

  <!-- 消息区：所有对话气泡都插在这里 -->
  <main class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h1>有什么可以帮你的？</h1>
      <p>当前是本地演示版：服务端返回写死的文字，用来验证流式链路。</p>
    </div>
  </main>

  <!-- 底部输入区：回车发送，Shift + 回车换行 -->
  <footer class="composer">
    <div class="composer__box">
      <textarea id="input" rows="1" placeholder="给 ai-chat 发送消息"></textarea>
      <button id="send" class="btn btn--send" type="button" title="发送">↑</button>
      <button id="stop" class="btn btn--stop" type="button" title="停止生成" hidden>■</button>
    </div>
    <div class="composer__hint">Enter 发送，Shift + Enter 换行</div>
  </footer>
  </div>

  <!-- 登录 / 注册遮罩：没有会话时盖住整个页面 -->
  <div class="auth" id="auth" hidden>
    <div class="auth__box">
      <h2 class="auth__title">ai-chat</h2>
      <div class="auth__tabs">
        <button id="tab-login" class="auth__tab is-active" type="button">登录</button>
        <button id="tab-register" class="auth__tab" type="button">注册</button>
      </div>
      <input id="auth-username" class="auth__input" placeholder="用户名" autocomplete="username" />
      <input id="auth-password" class="auth__input" type="password" placeholder="密码"
             autocomplete="current-password" />
      <input id="auth-code" class="auth__input" placeholder="邀请码" hidden />
      <button id="auth-submit" class="auth__submit" type="button">登录</button>
      <div id="auth-error" class="auth__error"></div>
    </div>
  </div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
